name: CI

on:
  pull_request:
    branches: [main]

jobs:
  node:
    name: lint + test / ${{matrix.name}}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gateway
            dir: services/gateway
          - name: web
            dir: web
    defaults:
      run:
        working-directory: ${{matrix.dir}}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6.5.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ${{ matrix.dir }}/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build
  shipments-service:
      name: lint+test / shipments-service
      runs-on: ubuntu-latest
      defaults:
        run:
          working-directory: services/shipments-service
      steps:
        - uses: actions/checkout@v7
        - uses: actions/setup-python@v7
          with:
            python-version: "3.12"
            cache: pip
            cache-dependency-path: services/shipments-service/pyproject.toml

        - run: pip install -e ".[dev]"
        - run: ruff check .
        - run: pytest
  tracking-service:
      name: lint+test / tracking-service
      runs-on: ubuntu-latest
      defaults:
        run:
          working-directory: services/tracking-service
      steps:
        - uses: actions/checkout@v4

        - uses: actions/setup-go@v5
          with:
            go-version: "1.22"
            cache-dependency-path: services/tracking-service/go.sum

        - run: gofmt -l . | tee /tmp/gofmt.out && test ! -s /tmp/gofmt.out
        - run: go vet ./...

        - uses: golangci/golangci-lint-action@v6
          with:
            working-directory: services/tracking-service
            version: latest

        - run: go test ./...
