name: parcelpigeon

services:
  # ---------------------------------------------------------------- infra ----
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-parcelpigeon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-parcelpigeon}
      POSTGRES_DB: ${POSTGRES_DB:-shipments}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-parcelpigeon}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "1025:1025"
      - "8025:8025"

  # ------------------------------------------------------------- services ----
  shipments-service:
    build: ./services/shipments-service
    environment:
      SHIPMENTS_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-parcelpigeon}:${POSTGRES_PASSWORD:-parcelpigeon}@postgres:5432/${POSTGRES_DB:-shipments}
      SHIPMENTS_RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      SHIPMENTS_PUBLISH_EVENTS: "true"
      SHIPMENTS_LOG_LEVEL: INFO
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 10

  tracking-service:
    build: ./services/tracking-service
    environment:
      TRACKING_HTTP_ADDR: ":8002"
      TRACKING_REDIS_ADDR: redis:6379
      TRACKING_RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      TRACKING_SHIPMENTS_URL: http://shipments-service:8000
      TRACKING_SMTP_ADDR: mailhog:1025
    ports:
      - "8002:8002"
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      shipments-service:
        condition: service_started

  gateway:
    build: ./services/gateway
    environment:
      PORT: "8000"
      SHIPMENTS_URL: http://shipments-service:8000
      TRACKING_URL: http://tracking-service:8002
      GATEWAY_API_KEY: ${GATEWAY_API_KEY:-}
      LOG_LEVEL: info
    ports:
      - "8000:8000"
    depends_on:
      shipments-service:
        condition: service_started
      tracking-service:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build: ./web
    ports:
      - "8080:8080"
    depends_on:
      gateway:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  redisdata:
  rabbitmqdata:
